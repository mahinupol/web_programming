<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planner | SmartStudy</title>
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/dashboard.css">
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/app.js" defer></script>
  
  <style>
    .planner-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      background: var(--bg-tertiary);
      padding: 1rem;
      border-radius: var(--border-radius);
      border: 1px solid var(--border-color);
    }
    
    .date-selector {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    
    .current-date {
      font-size: 1.25rem;
      font-weight: 600;
    }
    
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 0;
      background: var(--bg-tertiary);
      border-radius: var(--border-radius);
      border: 1px solid var(--border-color);
      overflow: hidden;
    }
    
    .timeline-row {
      display: flex;
      min-height: 80px;
      border-bottom: 1px solid var(--border-color);
    }
    
    .timeline-row:last-child {
      border-bottom: none;
    }
    
    .timeline-time {
      width: 80px;
      padding: 1rem;
      text-align: right;
      font-size: 0.875rem;
      color: var(--text-tertiary);
      border-right: 1px solid var(--border-color);
      background: var(--bg-secondary);
      font-weight: 500;
    }
    
    .timeline-content {
      flex: 1;
      padding: 0.5rem;
      position: relative;
    }
    
    .timeline-block {
      background: var(--accent-light);
      border-left: 4px solid var(--accent-primary);
      border-radius: 4px;
      padding: 0.5rem 1rem;
      margin: 0.25rem 0;
      cursor: pointer;
      transition: var(--transition);
    }
    
    .timeline-block:hover {
      transform: translateX(4px);
      box-shadow: var(--shadow-sm);
    }
    
    .block-title {
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--text-primary);
    }
    
    .block-meta {
      font-size: 0.75rem;
      color: var(--text-secondary);
      display: flex;
      gap: 1rem;
      margin-top: 0.25rem;
    }
    
    .view-toggle {
      display: flex;
      background: var(--bg-secondary);
      border-radius: var(--border-radius-sm);
      padding: 0.25rem;
    }
    
    .view-btn {
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      color: var(--text-secondary);
      transition: var(--transition);
      border: none;
      background: transparent;
    }
    
    .view-btn.active {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-placeholder"></div>
    
    <main class="main-content">
      <header class="dashboard-topbar">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <h1 style="font-size: 1.25rem; margin: 0;">Daily Planner</h1>
        </div>
        <div class="topbar-actions">
          <button id="theme-toggle" class="icon-btn"><i data-lucide="moon" class="dark-icon"></i><i data-lucide="sun" class="light-icon" style="display: none;"></i></button>
        </div>
      </header>
      
      <div class="page-content fade-in">
        
        <div class="planner-header">
          <div class="date-selector">
            <button class="icon-btn"><i data-lucide="chevron-left"></i></button>
            <div class="current-date">Today, Oct 24</div>
            <button class="icon-btn"><i data-lucide="chevron-right"></i></button>
          </div>
          
          <div class="view-toggle">
            <button class="view-btn active">Daily</button>
            <button class="view-btn">Weekly</button>
          </div>
        </div>
        
        <div class="timeline">
          <!-- 08:00 -->
          <div class="timeline-row">
            <div class="timeline-time">08:00</div>
            <div class="timeline-content"></div>
          </div>
          
          <!-- 09:00 -->
          <div class="timeline-row">
            <div class="timeline-time">09:00</div>
            <div class="timeline-content">
              <div class="timeline-block" style="border-left-color: var(--success); background: rgba(16, 185, 129, 0.1);">
                <div class="block-title">Calculus Lecture</div>
                <div class="block-meta">
                  <span><i data-lucide="map-pin" style="width:12px;height:12px;"></i> Room 302</span>
                  <span>09:00 - 10:30</span>
                </div>
              </div>
            </div>
          </div>
          
          <!-- 10:00 -->
          <div class="timeline-row">
            <div class="timeline-time">10:00</div>
            <div class="timeline-content"></div>
          </div>
          
          <!-- 11:00 -->
          <div class="timeline-row">
            <div class="timeline-time">11:00</div>
            <div class="timeline-content">
              <div class="timeline-block" style="border-left-color: var(--accent-primary); background: var(--accent-light);">
                <div class="block-title">Deep Work: CS Project</div>
                <div class="block-meta">
                  <span><i data-lucide="book" style="width:12px;height:12px;"></i> Study Session</span>
                  <span>11:00 - 13:00</span>
                </div>
              </div>
            </div>
          </div>
          
          <!-- 12:00 -->
          <div class="timeline-row">
            <div class="timeline-time">12:00</div>
            <div class="timeline-content"></div>
          </div>
          
          <!-- 13:00 -->
          <div class="timeline-row">
            <div class="timeline-time">13:00</div>
            <div class="timeline-content">
              <div class="timeline-block" style="border-left-color: var(--text-tertiary); background: var(--bg-secondary); border-style: dashed;">
                <div class="block-title" style="color: var(--text-secondary);">Lunch Break</div>
              </div>
            </div>
          </div>
          
          <!-- 14:00 -->
          <div class="timeline-row">
            <div class="timeline-time">14:00</div>
            <div class="timeline-content">
               <div class="timeline-block" style="border-left-color: var(--warning); background: rgba(245, 158, 11, 0.1);">
                <div class="block-title">Read English Literature</div>
                <div class="block-meta">
                  <span><i data-lucide="book-open" style="width:12px;height:12px;"></i> Chapter 4</span>
                  <span>14:00 - 15:30</span>
                </div>
              </div>
            </div>
          </div>
          
          <!-- 15:00 - 17:00 (Empty for spacing) -->
          <div class="timeline-row">
            <div class="timeline-time">15:00</div>
            <div class="timeline-content"></div>
          </div>
          <div class="timeline-row">
            <div class="timeline-time">16:00</div>
            <div class="timeline-content"></div>
          </div>
          <div class="timeline-row">
            <div class="timeline-time">17:00</div>
            <div class="timeline-content"></div>
          </div>
        </div>
        
      </div>
    </main>
  </div>
</body>
</html>
