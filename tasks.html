<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks | SmartStudy</title>
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/dashboard.css">
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/app.js" defer></script>
  <script type="module" src="js/tasks.js"></script>
  
  <style>
    .task-board {
      display: flex;
      gap: 1.5rem;
      overflow-x: auto;
      padding-bottom: 1rem;
      min-height: 500px;
    }
    
    .board-column {
      flex: 1;
      min-width: 300px;
      background: var(--bg-secondary);
      border-radius: var(--border-radius);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    .column-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }
    
    .column-count {
      background: var(--bg-tertiary);
      padding: 0.125rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
    
    .task-card {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-sm);
      padding: 1rem;
      cursor: grab;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }
    
    .task-card:active {
      cursor: grabbing;
    }
    
    .task-card:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--accent-light);
    }
    
    .task-tags {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }
    
    .task-title {
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }
    
    .task-desc {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-bottom: 1rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .task-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-tertiary);
      border-top: 1px solid var(--border-color);
      padding-top: 0.75rem;
    }
    
    /* Add Task Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    
    .modal-overlay.active {
      display: flex;
    }
    
    .modal-content {
      background: var(--bg-tertiary);
      border-radius: var(--border-radius-lg);
      width: 100%;
      max-width: 500px;
      padding: 2rem;
      box-shadow: var(--shadow-float);
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-placeholder"></div>
    
    <main class="main-content">
      <header class="dashboard-topbar">
        <div style="display: flex; align-items: center; gap: 1rem; flex: 1;">
          <button id="mobile-menu-toggle" class="icon-btn mobile-menu-btn" title="Toggle sidebar"><i data-lucide="menu"></i></button>
          <h1 style="font-size: 1.25rem; margin: 0;">Task Management</h1>
        </div>
        <div class="topbar-actions">
          <div class="search-bar" style="width: 220px;">
            <i data-lucide="search"></i>
            <input type="text" id="tasks-search" placeholder="Search tasks...">
          </div>
          <button id="theme-toggle" class="icon-btn" title="Toggle theme"><i data-lucide="moon" class="dark-icon"></i><i data-lucide="sun" class="light-icon" style="display: none;"></i></button>
        </div>
      </header>
      
      <div class="page-content fade-in">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
          <div class="search-bar task-search-bar" style="width: 300px;">
            <i data-lucide="search"></i>
            <input type="text" id="task-search-input" placeholder="Search tasks...">
          </div>
          <button class="btn btn-primary" id="open-task-modal-btn">
            <i data-lucide="plus"></i> Add Task
          </button>
        </div>
        
        <!-- Kanban Board -->
        <div class="task-board">
          <div class="board-column" data-status="todo">
            <div class="column-header">
              <span>To Do</span>
              <span class="column-count" data-count="todo">0</span>
            </div>
            <div class="column-body" data-list="todo"></div>
          </div>
          <div class="board-column" data-status="inProgress">
            <div class="column-header">
              <span>In Progress</span>
              <span class="column-count" data-count="inProgress">0</span>
            </div>
            <div class="column-body" data-list="inProgress"></div>
          </div>
          <div class="board-column" data-status="done">
            <div class="column-header">
              <span>Completed</span>
              <span class="column-count" data-count="done">0</span>
            </div>
            <div class="column-body" data-list="done"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add Task Modal -->
  <div id="taskModal" class="modal-overlay">
    <div class="modal-content slide-up">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h2 style="font-size: 1.5rem;">Create New Task</h2>
        <button class="icon-btn" onclick="document.getElementById('taskModal').classList.remove('active')"><i data-lucide="x"></i></button>
      </div>
      
      <form id="task-form">
        <div class="form-group">
          <label class="form-label">Task Title</label>
          <input type="text" id="task-title" class="form-control" required placeholder="What needs to be done?">
        </div>
        <div class="form-group">
          <label class="form-label">Subject</label>
          <input type="text" id="task-subject" class="form-control" placeholder="e.g. Mathematics">
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea id="task-description" class="form-control" rows="3" placeholder="Optional details"></textarea>
        </div>
        <div style="display: flex; gap: 1rem;">
          <div class="form-group" style="flex: 1;">
            <label class="form-label">Due Date</label>
            <input type="date" id="task-due" class="form-control">
          </div>
          <div class="form-group" style="flex: 1;">
            <label class="form-label">Estimated Time (hours)</label>
            <input type="number" id="task-duration" class="form-control" placeholder="2" min="0" step="0.25">
          </div>
        </div>
        <div style="display: flex; gap: 1rem;">
          <div class="form-group" style="flex: 1;">
            <label class="form-label">Priority</label>
            <select id="task-priority" class="form-control">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="form-group" style="flex: 1;">
            <label class="form-label">Status</label>
            <select id="task-status" class="form-control">
              <option value="todo" selected>To Do</option>
              <option value="inProgress">In Progress</option>
              <option value="done">Completed</option>
            </select>
          </div>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
          <button type="button" class="btn btn-ghost" onclick="document.getElementById('taskModal').classList.remove('active')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Task</button>
        </div>
      </form>
    </div>
  </div>
</body>
<style>
  @media (max-width: 600px) {
    .task-search-bar { display: none; }
    .task-board { flex-direction: column; }
    .board-column { min-width: 100%; }
  }
</style>
</html>
