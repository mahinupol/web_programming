<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | SmartStudy</title>
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/app.js" defer></script>
  <script type="module" src="js/auth.js"></script>
</head>
<body>
  
  <!-- Back to home -->
  <a href="index.html" style="position: absolute; top: 2rem; left: 2rem; display: flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); font-weight: 500;">
    <i data-lucide="arrow-left" style="width: 20px; height: 20px;"></i> Back to Home
  </a>

  <!-- Theme Toggle -->
  <button id="theme-toggle" class="icon-btn" style="position: absolute; top: 2rem; right: 2rem;">
    <i data-lucide="moon" class="dark-icon"></i>
    <i data-lucide="sun" class="light-icon" style="display: none;"></i>
  </button>

  <div class="auth-wrapper">
    <div class="auth-card slide-up">
      <div class="auth-header">
        <div class="auth-logo">
          <i data-lucide="user-plus"></i>
        </div>
        <h1 class="auth-title">Create an account</h1>
        <p class="auth-subtitle">Start planning your studies intelligently.</p>
      </div>
      
      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="John Doe" required>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="form-control" placeholder="hello@example.com" required>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required minlength="8">
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">Create Account</button>
      </form>
      
      <div class="auth-footer">
        Already have an account? <a href="login.html">Log in</a>
      </div>
    </div>
  </div>

  <!-- End of register template -->
</body>
</html>
