<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics | SmartStudy</title>
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/dashboard.css">
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/app.js" defer></script>
  <script src="js/analytics.js" defer></script>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-placeholder"></div>
    
    <main class="main-content">
      <header class="dashboard-topbar">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <h1 style="font-size: 1.25rem; margin: 0;">Analytics & Progress</h1>
        </div>
        <div class="topbar-actions">
          <button id="theme-toggle" class="icon-btn"><i data-lucide="moon" class="dark-icon"></i><i data-lucide="sun" class="light-icon" style="display: none;"></i></button>
        </div>
      </header>
      
      <div class="page-content fade-in">
        
        <div class="dashboard-grid">
          
          <!-- Study Hours Trend Chart -->
          <div class="col-span-8 card">
            <div class="card-header">
              <h2 class="card-title">Study Hours Trend (This Week)</h2>
            </div>
            <div style="position: relative; height: 300px; width: 100%;">
              <canvas id="trendChart"></canvas>
            </div>
          </div>
          
          <!-- Subject Distribution Chart -->
          <div class="col-span-4 card">
            <div class="card-header">
              <h2 class="card-title">Subject Distribution</h2>
            </div>
            <div style="position: relative; height: 300px; width: 100%; display: flex; justify-content: center;">
              <canvas id="subjectChart"></canvas>
            </div>
          </div>
          
          <!-- Productivity Stats -->
          <div class="col-span-12 card" style="margin-top: 1rem;">
            <div class="card-header">
              <h2 class="card-title">Productivity Insights</h2>
            </div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem;">
              
              <div style="display: flex; align-items: center; gap: 1rem;">
                <div style="width: 48px; height: 48px; border-radius: 50%; background: rgba(16, 185, 129, 0.1); color: var(--success); display: flex; align-items: center; justify-content: center;">
                  <i data-lucide="trending-up"></i>
                </div>
                <div>
                  <div style="font-size: 0.875rem; color: var(--text-secondary);">Most Productive Day</div>
                  <div style="font-weight: 600; font-size: 1.125rem;">Tuesday</div>
                </div>
              </div>
              
              <div style="display: flex; align-items: center; gap: 1rem;">
                <div style="width: 48px; height: 48px; border-radius: 50%; background: rgba(94, 106, 210, 0.1); color: var(--accent-primary); display: flex; align-items: center; justify-content: center;">
                  <i data-lucide="clock"></i>
                </div>
                <div>
                  <div style="font-size: 0.875rem; color: var(--text-secondary);">Average Session Length</div>
                  <div style="font-weight: 600; font-size: 1.125rem;">1h 45m</div>
                </div>
              </div>
              
              <div style="display: flex; align-items: center; gap: 1rem;">
                <div style="width: 48px; height: 48px; border-radius: 50%; background: rgba(245, 158, 11, 0.1); color: var(--warning); display: flex; align-items: center; justify-content: center;">
                  <i data-lucide="target"></i>
                </div>
                <div>
                  <div style="font-size: 0.875rem; color: var(--text-secondary);">Task Completion Rate</div>
                  <div style="font-weight: 600; font-size: 1.125rem;">85%</div>
                </div>
              </div>
              
            </div>
          </div>
          
        </div>
      </div>
    </main>
  </div>
</body>
</html>
