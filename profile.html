<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | SmartStudy</title>
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/dashboard.css">
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/app.js" defer></script>
  <script type="module" src="js/profile.js"></script>
  
  <style>
    .profile-header {
      display: flex;
      align-items: flex-end;
      gap: 2rem;
      margin-bottom: 2rem;
      position: relative;
    }
    
    .profile-cover {
      position: absolute;
      top: -2rem;
      left: -2rem;
      right: -2rem;
      height: 160px;
      background: linear-gradient(135deg, var(--accent-light), var(--accent-hover));
      border-radius: var(--border-radius-lg) var(--border-radius-lg) 0 0;
      z-index: 0;
    }
    
    .profile-avatar-container {
      position: relative;
      z-index: 1;
      padding-top: 80px;
      padding-left: 2rem;
    }
    
    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--bg-tertiary);
      border: 4px solid var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 700;
      color: var(--accent-primary);
      box-shadow: var(--shadow-md);
    }
    
    .profile-info {
      position: relative;
      z-index: 1;
      padding-bottom: 1rem;
    }
    
    .achievement-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
    }
    
    .achievement-card {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 1.5rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    
    .achievement-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-light);
      color: var(--accent-primary);
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-placeholder"></div>
    
    <main class="main-content">
      <header class="dashboard-topbar">
        <div style="display: flex; align-items: center; gap: 1rem; flex: 1;">
          <button id="mobile-menu-toggle" class="icon-btn mobile-menu-btn" title="Toggle sidebar"><i data-lucide="menu"></i></button>
          <h1 style="font-size: 1.25rem; margin: 0;">My Profile</h1>
        </div>
        <div class="topbar-actions">
          <button id="theme-toggle" class="icon-btn" title="Toggle theme"><i data-lucide="moon" class="dark-icon"></i><i data-lucide="sun" class="light-icon" style="display: none;"></i></button>
        </div>
      </header>
      
      <div class="page-content fade-in">
        
        <div class="card" style="padding: 0; overflow: hidden; margin-bottom: 2rem;">
          <div class="profile-header">
            <div class="profile-cover"></div>
            
            <div class="profile-avatar-container">
              <div class="profile-avatar" id="profile-initial">?</div>
            </div>
            
            <div class="profile-info">
              <h2 id="profile-name" style="margin-bottom: 0.25rem;">Loading...</h2>
              <p id="profile-email" style="margin: 0;"></p>
            </div>
            
            <div style="flex: 1; text-align: right; z-index: 1; padding-bottom: 1rem; padding-right: 2rem;">
              <button class="btn btn-primary" onclick="showToast('Edit profile feature coming soon!')">Edit Profile</button>
            </div>
          </div>
          
          <div style="padding: 2rem; border-top: 1px solid var(--border-color); display: flex; gap: 2rem;">
            <div style="flex: 1;">
              <h3 style="font-size: 1rem; margin-bottom: 1rem; color: var(--text-secondary);">Bio</h3>
              <p id="profile-bio" style="margin: 0;">No bio yet.</p>
            </div>
            <div style="flex: 1;">
              <h3 style="font-size: 1rem; margin-bottom: 1rem; color: var(--text-secondary);">Details</h3>
              <ul style="display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.875rem;">
                <li style="display: flex; align-items: center; gap: 0.5rem;"><i data-lucide="map-pin" style="width:16px;"></i> <span id="profile-location">No location set</span></li>
                <li style="display: flex; align-items: center; gap: 0.5rem;"><i data-lucide="calendar" style="width:16px;"></i> <span id="profile-joined">Not set</span></li>
              </ul>
            </div>
          </div>
        </div>
        
        <h2 style="font-size: 1.25rem; margin-bottom: 1.5rem;">Achievements</h2>
        
        <div class="achievement-grid">
          <div class="achievement-card" style="opacity: 0.7;">
            <div class="achievement-icon" style="background: var(--bg-secondary); color: var(--text-tertiary);">
              <i data-lucide="star" style="width:32px;height:32px;"></i>
            </div>
            <div>
              <h3 style="font-size: 1rem; margin-bottom: 0.25rem;">No achievements yet</h3>
              <p style="font-size: 0.75rem; color: var(--text-tertiary); margin: 0;">Complete tasks to unlock badges.</p>
            </div>
          </div>
        </div>
        
      </div>
    </main>
  </div>
  
</body>
</html>
