    <button class="sidebar-close-btn" id="sidebar-close-btn" title="Close menu">
      <i data-lucide="x"></i>

  </div>

  <div class="sidebar-menu">
    <div class="sidebar-menu-title">Overview</div>
    <a href="dashboard.html" class="sidebar-item" data-page="dashboard">
      <i data-lucide="layout-dashboard"></i>
      <span>Dashboard</span>

    <a href="tasks.html" class="sidebar-item" data-page="tasks">
      <i data-lucide="check-square"></i>

    </a>
    <a href="planner.html" class="sidebar-item" data-page="planner">
      <i data-lucide="calendar"></i>

    <div class="sidebar-menu-title" style="margin-top: 1rem;">Insights</div>
    <a href="analytics.html" class="sidebar-item" data-page="analytics">

<style>
  .sidebar-close-btn {
    display: none;
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 0.4rem;
    border-radius: 6px;
    margin-left: auto;
    transition: var(--transition);
  }

  .sidebar-close-btn:hover {
    background: var(--danger-light);
    color: var(--danger);
  }

  .sidebar-close-btn i {
    width: 20px;
    height: 20px;
  }

  .logout-btn {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    border-radius: var(--border-radius-sm);
    font-weight: 500;
    font-family: 'Sora', sans-serif;
    font-size: 1rem;
    transition: var(--transition);
  }

  .logout-btn:hover {
    background: var(--danger-light) !important;
    transform: translateX(4px);
  }

  @media (max-width: 768px) {
    .sidebar-close-btn {
      display: flex;
      align-items: center;
      justify-content: center;
    }
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Close sidebar button
    const closeBtn = document.getElementById('sidebar-close-btn');
    const sidebar = document.querySelector('.sidebar');
    if (closeBtn && sidebar) {
      closeBtn.addEventListener('click', () => {
        sidebar.classList.remove('open');
      });
    }
  });
</script>
